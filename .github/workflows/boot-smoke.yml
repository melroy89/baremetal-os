name: Boot smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and test tools
        # The ubuntu-26.04 runner image includes binutils and make.
        run: |
          sudo apt-get -o Acquire::Languages=none update
          sudo apt-get install -y --no-install-recommends \
            nasm grub-common grub-pc-bin grub-efi-amd64-bin \
            mtools xorriso qemu-system-x86 qemu-utils ovmf-generic gdisk dosfstools socat

      - name: Build and test
        run: make -j"$(nproc)" --output-sync=target test
