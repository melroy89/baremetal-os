name: Boot smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            nasm binutils make grub-common grub-pc-bin grub-efi-amd64-bin \
            mtools xorriso qemu-system-x86 ovmf

      - name: Build the kernel and hybrid ISO
        run: make -j"$(nproc)" os-check os-iso

      - name: Boot the ELF and ISO in QEMU
        run: bash tests/boot_smoke.sh
